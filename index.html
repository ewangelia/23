<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>23</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,700;1,9..40,300&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  height:100%;background:#000;color:#fff;
  font-family:'DM Sans',system-ui,sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2.5rem 2rem;text-align:center;
  opacity:0;transition:opacity .75s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.screen.show{opacity:1;pointer-events:all}
.t-huge{
  font-size:clamp(7rem,42vw,14rem);font-weight:700;
  line-height:1;letter-spacing:-.04em;
  text-shadow:0 0 100px rgba(255,255,255,.12);
}
.t-head{font-size:1.85rem;font-weight:300;letter-spacing:-.01em;margin-bottom:.5rem}
.t-body{font-size:.95rem;font-weight:300;color:rgba(255,255,255,.48);line-height:1.8}
.t-dim{font-size:.75rem;font-weight:300;color:rgba(255,255,255,.22);letter-spacing:.05em}
.t-i{font-style:italic}
.btn{
  margin-top:3rem;padding:.7rem 2.4rem;
  border:1px solid rgba(255,255,255,.22);
  background:transparent;color:#fff;
  font-family:inherit;font-size:.7rem;
  letter-spacing:.2em;text-transform:uppercase;
  cursor:pointer;
  transition:border-color .25s,background .25s;
}
.btn:hover{border-color:rgba(255,255,255,.5)}
.btn:active{background:rgba(255,255,255,.08)}

/* VIDEO */
#s3{padding:0;background:#000}
.vid-wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}
.vid-wrap iframe{
  width:100%;height:100%;border:none;
}
.skip{
  position:absolute;
  bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));right:1.25rem;
  border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.55);
  color:rgba(255,255,255,.4);font-family:inherit;font-size:.65rem;
  letter-spacing:.14em;text-transform:uppercase;padding:.45rem .9rem;
  cursor:pointer;backdrop-filter:blur(6px);z-index:10;
}

/* REVEAL ANIMATION */
#s4.show .t-huge{animation:revealNum 1.1s .15s cubic-bezier(.16,1,.3,1) both}
@keyframes revealNum{
  from{opacity:0;transform:scale(.72) translateY(18px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}

/* DOTS */
.dots{
  position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  display:flex;gap:7px;z-index:200;pointer-events:none;
  transition:opacity .35s;
}
.dot{
  width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,.18);
  transition:background .35s,transform .35s;
}
.dot.on{background:rgba(255,255,255,.65);transform:scale(1.4)}
</style>
</head>
<body>

<!-- SCREEN 1 -->
<div class="screen show" id="s1">
  <div class="t-head">hey.</div>
  <div class="t-body">I made something.</div>
  <button class="btn" onclick="go(1)">OPEN</button>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
  <div class="t-body t-i">nothing serious.<br>just watch.</div>
  <button class="btn" onclick="go(2)">▶&ensp;PLAY</button>
</div>

<!-- SCREEN 3 VIDEO -->
<div class="screen" id="s3">
  <div class="vid-wrap">
    <iframe
      src="https://drive.google.com/file/d/1ffjB0WV6r5Gi-2-UObBOyAPgju1uRWn0/preview"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>
  <button class="skip" onclick="go(3)">skip →</button>
</div>

<!-- SCREEN 4 REVEAL -->
<div class="screen" id="s4">
  <div class="t-body t-i" style="margin-bottom:1.75rem">oh, and...</div>
  <span class="t-huge">23</span>
  <div class="t-body" style="margin-top:1.75rem">happy 23.</div>
  <button class="btn" onclick="go(4)">→</button>
</div>

<!-- SCREEN 5 ENDING -->
<div class="screen" id="s5">
  <div style="font-size:1.35rem;font-weight:300;line-height:1.65;margin-bottom:1.25rem">
    I like having<br>you around.
  </div>
  <div class="t-body" style="margin-bottom:2.5rem">that's it.<br>that's the message.</div>
  <div class="t-dim">see you around :)</div>
</div>

<!-- DOTS -->
<div class="dots" id="dots">
  <div class="dot on" id="d0"></div>
  <div class="dot" id="d1"></div>
  <div class="dot" id="d2"></div>
  <div class="dot" id="d3"></div>
  <div class="dot" id="d4"></div>
</div>

<script>
const S=['s1','s2','s3','s4','s5'];
const D=['d0','d1','d2','d3','d4'];
let cur=0;
function go(next){
  document.getElementById(S[cur]).classList.remove('show');
  document.getElementById(D[cur]).classList.remove('on');
  cur=next;
  document.getElementById(S[cur]).classList.add('show');
  document.getElementById(D[cur]).classList.add('on');
  document.getElementById('dots').style.opacity=cur===2?'0':'1';
}
</script>
</body>
</html>
